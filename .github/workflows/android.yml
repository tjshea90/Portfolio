# Build a signed, installable Portfolio APK on GitHub's runners.
#
# WHY THIS EXISTS
# ---------------
# Every APK before this was built inside a Claude container by ship.sh. That
# works, but it means an installable build requires a working Claude session.
# This path does not: tag a version and GitHub produces the APK, so a usage
# cap, a dead container or no Claude access at all never stands between Tj and
# a build he can install.
#
# MINUTES ARE THE SCARCE RESOURCE — READ BEFORE EDITING
# -----------------------------------------------------
# Private repos get 2,000 free Actions minutes a month. Two rules protect them,
# and tools/test_resume.sh fails if either is undone:
#
#   1. NEVER add a `push:` branch trigger. tools/autosave.sh commits after
#      every tool call and tools/push.sh mirrors each one to main — 48 commits
#      in a single two-hour session, measured. A push trigger would start a run
#      every few seconds and exhaust the month almost immediately. Tags and
#      manual dispatch only.
#
#   2. CHEAP GATES FIRST. Everything that can reject a build runs before
#      anything expensive: a run that is going to fail costs ~1 minute, not
#      ~12. A manual run does the gates ONLY unless full_build is ticked, so
#      "check the setup still works" is nearly free and only a real release
#      spends real minutes.
#
# RELATIONSHIP TO ship.sh
# -----------------------
# ship.sh remains the release of record: it owns versionCode discipline,
# BUILDLOG.md and the committed APK under releases/. This workflow publishes to
# GitHub Releases and artifacts and deliberately COMMITS NOTHING — a workflow
# that pushed would retrigger the autosave/mirror machinery and race with
# whatever session is running.
name: Build APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      full_build:
        description: 'Build, smoke-test on an emulator and publish a signed APK (~20 min of Actions minutes). Leave OFF for a ~1 min check that the setup still works.'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      # Needed by keytool for the keystore gate below, so it comes before the
      # gates. Preinstalled on the runner image, so this costs seconds.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Decide how much of this run costs money
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.full_build }}" = "true" ]; then
            echo "full=true" >> "$GITHUB_OUTPUT"
            echo "FULL BUILD — tests, signed APK, publish." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "full=false" >> "$GITHUB_OUTPUT"
            echo "GATES ONLY — verifying the setup without spending build minutes." >> "$GITHUB_STEP_SUMMARY"
            echo "Re-run with **full_build** ticked, or push a \`v*\` tag, to build a real APK." >> "$GITHUB_STEP_SUMMARY"
          fi

      # ---- the cheap gates: seconds each, and any of them can end the run ----

      # The same guard the local build runs (BRIEF.md). Calling the repo's own
      # script rather than restating it is deliberate: a check that exists twice
      # is a check that will disagree with itself eventually.
      - name: Gate — init-order guard
        run: python3 tools/checkinit.py

      # app/sideload.jks is not in git and cannot be. The runner can only get it
      # from a secret. Without it NOTHING here can produce an installable APK —
      # including a debug build, because app/build.gradle.kts signs both build
      # types with this key.
      - name: Gate — restore the signing keystore
        env:
          KS_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::error::SIGNING_KEYSTORE_BASE64 is not set. Add it under Settings -> Secrets and variables -> Actions. See BRIEF.md."
            exit 1
          fi
          printf '%s' "$KS_B64" | base64 -d > app/sideload.jks
          chmod 600 app/sideload.jks
          echo "restored $(wc -c < app/sideload.jks) bytes"

      # Is it the RIGHT key? A wrong one builds and installs perfectly and only
      # fails to UPDATE the phone, which Android reports at install time.
      - name: Gate — the keystore is the one the phone accepts
        run: bash tools/checkkeystore.sh

      # Android refuses an install whose versionCode is not higher than what is
      # already on the phone, so building one is minutes spent on an APK that
      # cannot be installed. BUILDLOG.md is the durable record of every shipped
      # code and the only thing that can answer this on a fresh runner.
      # WHAT ANDROID ACTUALLY REFUSES IS A DOWNGRADE, NOT A REBUILD.
      #
      # This gate first read `-le`, copied from ship.sh. That is the right test THERE:
      # ship.sh publishes a NEW release, and a new release whose versionCode is not higher
      # than the last one is not a new release. It is the wrong test HERE, because this
      # workflow's job is different - it produces an installable artifact of a version that
      # has already been decided.
      #
      # Android rejects an install whose versionCode is LOWER than what is on the phone
      # (INSTALL_FAILED_VERSION_DOWNGRADE). An EQUAL versionCode is a reinstall of the same
      # version: allowed, and data-preserving exactly as long as the signing certificate
      # matches - which the gate above has already proved. So rebuilding the current release
      # on a runner is a legitimate thing to want, and blocking it bought nothing.
      #
      # BRIEF.md's one-line rule says Android "refuses to install a build whose versionCode
      # is not higher". For SHIPPING that is the rule to follow and ship.sh still enforces
      # it strictly. It is stricter than the platform's actual behaviour, which is why the
      # two gates now differ on purpose rather than by accident.
      - name: Gate — versionCode is not a downgrade
        run: |
          VCODE=$(grep -m1 -oE 'versionCode *= *[0-9]+' app/build.gradle.kts | grep -oE '[0-9]+')
          PREV=$(grep -oE 'code [0-9]+' BUILDLOG.md 2>/dev/null | grep -oE '[0-9]+' | sort -n | tail -1)
          PREV=${PREV:-0}
          echo "versionCode $VCODE, highest shipped $PREV"
          if [ "$VCODE" -lt "$PREV" ]; then
            echo "::error::versionCode $VCODE is LOWER than the highest shipped ($PREV). Android refuses that as a downgrade, so this APK could not be installed. Not spending the minutes."
            exit 1
          fi
          if [ "$VCODE" -eq "$PREV" ]; then
            echo "::warning::versionCode $VCODE equals the highest shipped ($PREV) — this is a REBUILD of the current release, not a new version. It installs over it as a reinstall. Bump versionCode in app/build.gradle.kts before shipping anything new."
          fi

      - name: Gates passed
        run: |
          echo "All gates green. Full build this run — ${{ steps.mode.outputs.full }}" >> "$GITHUB_STEP_SUMMARY"

      # ---- everything below costs real minutes and only runs for a release ----

      - uses: gradle/actions/setup-gradle@v4
        if: steps.mode.outputs.full == 'true'

      # Resolve sdkmanager explicitly rather than trusting PATH: runner images
      # move it between releases, and "command not found" here reads like a code
      # failure when it is nothing of the sort.
      - name: Android SDK packages
        if: steps.mode.outputs.full == 'true'
        run: |
          SDKM="$(command -v sdkmanager || true)"
          for c in "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
                   "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"; do
            [ -n "$SDKM" ] && break
            [ -x "$c" ] && SDKM="$c"
          done
          if [ -z "$SDKM" ]; then
            echo "::error::sdkmanager not found on this runner ($ANDROID_HOME)."
            exit 1
          fi
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" >/dev/null

      - name: Unit tests
        if: steps.mode.outputs.full == 'true'
        run: ./gradlew testDebugUnitTest --console=plain

      - name: Build the release APK
        if: steps.mode.outputs.full == 'true'
        run: ./gradlew :app:assembleRelease --console=plain

      # Check the artifact, not just the input.
      - name: Verify the APK signature
        if: steps.mode.outputs.full == 'true'
        run: bash tools/verify-apk.sh app/build/outputs/apk/release/app-release.apk

      # ---- THE RELEASE APK ITSELF IS RUN BEFORE ANYTHING IS PUBLISHED (2026-09-22b).
      # The release build is minified by R8 now, the one step that can break an app every unit
      # test passes on. tools/smoke-test.sh installs THIS APK on an emulator, launches it and
      # fuzzes it; a crash fails the run here, so the Publish step below never runs.
      - name: Smoke test — enable KVM for the emulator
        if: steps.mode.outputs.full == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Smoke test — launch and fuzz the release APK on an emulator
        if: steps.mode.outputs.full == 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash tools/smoke-test.sh app/build/outputs/apk/release/app-release.apk

      - name: Keep the smoke-test logs (failed runs only)
        if: failure() && steps.mode.outputs.full == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs
          path: smoke/
          retention-days: 7
          if-no-files-found: ignore

      - name: Name the APK
        id: v
        if: steps.mode.outputs.full == 'true'
        run: |
          VNAME=$(grep -m1 -oE 'versionName *= *"[^"]+"' app/build.gradle.kts | grep -oE '"[^"]+"' | tr -d '"')
          VCODE=$(grep -m1 -oE 'versionCode *= *[0-9]+' app/build.gradle.kts | grep -oE '[0-9]+')
          cp app/build/outputs/apk/release/app-release.apk "Portfolio-v${VNAME}.apk"
          echo "vname=$VNAME" >> "$GITHUB_OUTPUT"
          echo "vcode=$VCODE" >> "$GITHUB_OUTPUT"
          echo "Built Portfolio v$VNAME (versionCode $VCODE)" >> "$GITHUB_STEP_SUMMARY"


      # PUBLISHED ON EVERY FULL BUILD, AND GITHUB CREATES THE TAG ITSELF.
      #
      # This used to require a `refs/tags/*` push to have happened first. That cannot come
      # from a Claude container: the session's egress policy permits branch pushes but
      # answers 403 to a tag push, so `git push origin v7.8` fails there and no amount of
      # retrying will change it. Waiting on Tj to tag by hand would put a manual step back
      # into the one flow that is supposed to need none.
      #
      # `gh release create` creates the tag server-side when it does not exist, pointing it
      # at the commit this run built (--target). So a full build - however it was started -
      # produces a tagged, downloadable release, and a tag push still works for anyone who
      # can make one.
      - name: Publish the Release
        if: steps.mode.outputs.full == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.v.outputs.vname }}
          APK: Portfolio-v${{ steps.v.outputs.vname }}.apk
        run: |
          NOTES="versionCode ${{ steps.v.outputs.vcode }}, built and signed by GitHub Actions.
          The certificate was verified on this APK itself, so it installs over the existing
          app as an in-place update and does not erase the portfolio."
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG exists — replacing its APK"
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" \
              --target "$GITHUB_SHA" \
              --title "Portfolio $TAG" \
              --notes "$NOTES"
          fi
          echo "Published $TAG -> $(gh release view "$TAG" --json url -q .url)" >> "$GITHUB_STEP_SUMMARY"

      # KEPT ONLY WHEN SOMETHING WENT WRONG.
      #
      # This used to upload the APK as a 90-day artifact on EVERY full build, alongside
      # publishing the identical file as a Release asset. The Release is the permanent,
      # linkable copy Tj actually downloads, so the artifact was an 8 MB duplicate of it
      # accruing against a limited free-tier artifact allowance - a handful of releases and
      # it starts costing storage for nothing.
      #
      # On a FAILED run there is no Release, and the half-finished binary is worth keeping
      # briefly to look at. `if-no-files-found: ignore` because most failures happen before
      # an APK exists at all.
      - name: Keep the APK for inspection (failed runs only)
        if: failure() && steps.mode.outputs.full == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unpublished-apk
          path: Portfolio-*.apk
          retention-days: 7
          if-no-files-found: ignore

      # Belt and braces: the runner is destroyed anyway, but never leave a
      # decoded private key sitting in a workspace that later steps could read.
      - name: Remove the keystore from the workspace
        if: always()
        run: rm -f app/sideload.jks
