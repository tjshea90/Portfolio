# Build a signed, installable Portfolio APK on GitHub's runners.
#
# WHY THIS EXISTS
# ---------------
# Every APK before this was built inside a Claude container by ship.sh. That
# works, but it means an installable build requires a working Claude session.
# This path does not: tag a version (or press Run workflow) and GitHub produces
# the APK, so a usage cap, a dead container or no Claude access at all never
# stands between Tj and a build he can install.
#
# WHY IT DOES NOT RUN ON EVERY PUSH
# ---------------------------------
# tools/autosave.sh commits after every tool call and tools/push.sh mirrors
# each one to main — 48 commits in a single two-hour session, measured. A
# `push: branches: [main]` trigger would therefore start a run every few
# seconds and exhaust the 2,000 free private-repo minutes almost immediately.
# So: tags and manual dispatch only. That also matches what a release IS here
# — a deliberate act, not a side effect of checkpointing.
#
# RELATIONSHIP TO ship.sh
# -----------------------
# ship.sh remains the release of record: it owns versionCode discipline,
# BUILDLOG.md and the committed APK under releases/. This workflow publishes
# to GitHub Releases and artifacts and deliberately COMMITS NOTHING — a
# workflow that pushed would retrigger the autosave/mirror machinery and race
# with whatever session is running.
name: Build APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Matches the local toolchain (java 21). See BRIEF.md — the toolchain is
      # pinned on purpose; do not "upgrade" this to chase a newer AGP.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # Resolve sdkmanager explicitly rather than trusting PATH: runner images
      # move it between releases, and a "command not found" here reads like a
      # code failure when it is nothing of the sort.
      - name: Android SDK packages
        run: |
          SDKM="$(command -v sdkmanager || true)"
          for c in "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
                   "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"; do
            [ -n "$SDKM" ] && break
            [ -x "$c" ] && SDKM="$c"
          done
          if [ -z "$SDKM" ]; then
            echo "::error::sdkmanager not found on this runner ($ANDROID_HOME)."
            exit 1
          fi
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" >/dev/null

      # The same guard the local build runs — see BRIEF.md. Calling the repo's
      # own script rather than restating it is deliberate: a check that exists
      # twice is a check that will disagree with itself eventually.
      - name: Init-order guard
        run: python3 tools/checkinit.py

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --console=plain

      # app/sideload.jks is not in git and cannot be. The runner can only get
      # it from a secret. Without it NOTHING here can produce an installable
      # APK — including a debug build, because app/build.gradle.kts signs both
      # build types with this key.
      - name: Restore the signing keystore
        env:
          KS_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::error::SIGNING_KEYSTORE_BASE64 is not set. Add it under Settings -> Secrets and variables -> Actions. See BRIEF.md."
            exit 1
          fi
          printf '%s' "$KS_B64" | base64 -d > app/sideload.jks
          chmod 600 app/sideload.jks

      # Is it the RIGHT key? A wrong one builds and installs perfectly and only
      # fails to UPDATE the phone, which Android reports at install time.
      - name: Verify the keystore is the one the phone accepts
        run: bash tools/checkkeystore.sh

      - name: Build the release APK
        run: ./gradlew :app:assembleRelease --console=plain

      # Check the artifact, not just the input.
      - name: Verify the APK signature
        run: bash tools/verify-apk.sh app/build/outputs/apk/release/app-release.apk

      - name: Read the version
        id: v
        run: |
          VNAME=$(grep -m1 -oE 'versionName *= *"[^"]+"' app/build.gradle.kts | grep -oE '"[^"]+"' | tr -d '"')
          VCODE=$(grep -m1 -oE 'versionCode *= *[0-9]+' app/build.gradle.kts | grep -oE '[0-9]+')
          cp app/build/outputs/apk/release/app-release.apk "Portfolio-v${VNAME}.apk"
          echo "vname=$VNAME" >> "$GITHUB_OUTPUT"
          echo "vcode=$VCODE" >> "$GITHUB_OUTPUT"
          echo "Built Portfolio v$VNAME (versionCode $VCODE)" >> "$GITHUB_STEP_SUMMARY"

      # Android refuses an install whose versionCode is not higher than what is
      # on the phone. BUILDLOG.md is the durable record of every shipped code,
      # so it is the only thing that can answer this on a fresh runner.
      - name: Warn if versionCode was not bumped
        run: |
          PREV=$(grep -oE 'code [0-9]+' BUILDLOG.md 2>/dev/null | grep -oE '[0-9]+' | sort -n | tail -1)
          PREV=${PREV:-0}
          if [ "${{ steps.v.outputs.vcode }}" -le "$PREV" ]; then
            echo "::warning::versionCode ${{ steps.v.outputs.vcode }} is not higher than the last shipped ($PREV) — this APK will NOT install over what is on the phone. Bump versionCode in app/build.gradle.kts."
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Portfolio-v${{ steps.v.outputs.vname }}-apk
          path: Portfolio-*.apk
          retention-days: 90

      - name: Publish a Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" "Portfolio-v${{ steps.v.outputs.vname }}.apk" \
            --title "Portfolio ${{ github.ref_name }}" \
            --notes "versionCode ${{ steps.v.outputs.vcode }}. Signed with the usual certificate, so it installs over the existing app without erasing data." \
          || gh release upload "${{ github.ref_name }}" "Portfolio-v${{ steps.v.outputs.vname }}.apk" --clobber

      # Belt and braces: the runner is destroyed anyway, but never leave a
      # decoded private key sitting in a workspace that later steps could read.
      - name: Remove the keystore from the workspace
        if: always()
        run: rm -f app/sideload.jks
